h1{

font-size:100px;

color:white;

box-shadow:0 0 20px hotpink;

}

#yes:hover{
    transform:scale(1.1);

#no{
    background:linear-gradient(45deg,#ff006a,#ff4da6);

color:white;

box-shadow:0 0 20px hotpink;
    border:1px solid rgba(255,255,255,.4);

    

    position:fixed;

    transition:left .15s linear, top .15s linear;

    transform:none !important;
    box-sizing:border-box;
    z-index:9999;
}
#no:hover{
    transform:none;
}

@keyframes heartbeat{

0%{transform:scale(1);}
20%{transform:scale(1.12);}
40%{transform:scale(1);}
60%{transform:scale(1.15);}
100%{transform:scale(1);}

}

@keyframes pulse{

50%{

text-shadow:
0 0 15px hotpink,
0 0 40px deeppink;

}

}

@keyframes fadeUp{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

    </style>

<h1>💕 I Have Something to Ask You 💕</h1>

<div class="couple">
👨‍❤️‍👩
</div>

<p class="line">
Every moment with you feels magical. <br>
Will You Be My Girlfriend?  ❤️
</p>

<div class="buttons">

<button id="yes" onclick="location.href='success.html'">
YES ❤️
</button>

<button id="no">
NO 💔
</button>

</div>

</div>

<script>

const noBtn = document.getElementById("no");

function moveButton(){

    const rect = noBtn.getBoundingClientRect();

    const maxX = window.innerWidth - rect.width - 10;
    const maxY = window.innerHeight - rect.height - 10;

    const x = Math.max(10,Math.random()*maxX);
    const y = Math.max(10,Math.random()*maxY);

    noBtn.style.left = x+"px";
    noBtn.style.top = y+"px";
}

noBtn.addEventListener("mouseenter",moveButton);

noBtn.addEventListener("touchstart",function(e){

    e.preventDefault();
    moveButton();

},{passive:false});

</script>

</head>
<body>

<div class="container">

<h1>💕 I Have Something to Ask You 💕</h1>

<div class="couple">
👨‍❤️‍👩
</div>

<p class="line">
Every moment with you feels magical. <br>
Will You Be My Girlfriend?  ❤️
</p>

<div class="buttons">

<button id="yes" onclick="location.href='success.html'">
YES ❤️
</button>

<button id="no">
NO 💔
</button>

</div>

</div>

<script>
const noBtn = document.getElementById("no");

// Random position
function moveButton() {

    const maxX = window.innerWidth - noBtn.offsetWidth - 20;
    const maxY = window.innerHeight - noBtn.offsetHeight - 20;

    const x = Math.floor(Math.random() * maxX);
    const y = Math.floor(Math.random() * maxY);

    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

// PC
noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("mouseenter", moveButton);

// Mobile
noBtn.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveButton();
}, {passive:false});

// Agar kisi tarah click ho bhi jaye to bhi bhaag jayega
noBtn.addEventListener("click", function(e){
    e.preventDefault();
    moveButton();
});

// Shuru me bhi ek random position par bhej do
setTimeout(moveButton, 1000);
</script>

</body>
</html>
