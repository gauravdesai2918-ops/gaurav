<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Congratulations ❤️</title>

<style>

body{

margin:0;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#ff1493,#ff69b4);

font-family:Arial;

overflow:hidden;

color:white;

text-align:center;

}

.box{

animation:zoom 1s infinite alternate;

}

h1{

font-size:60px;

}

p{

font-size:30px;

}

@keyframes zoom{

from{

transform:scale(1);

}

to{

transform:scale(1.08);

}

}

</style>

</head>

<body>

<div class="box">

<h1>🎉 Congratulations 🎉</h1>

<p>

❤️ Thank You For Saying YES ❤️

<br><br>

You Made My Life Beautiful 💕

</p>

</div>

</body>
</html>
